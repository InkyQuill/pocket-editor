name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: JVM tests, lint, and unsigned release
        # This is a CI sanity build, not a distributable release (see the
        # signed-release job for that), so a real Yandex OAuth client isn't
        # needed here — just a non-blank value to satisfy the release gate.
        env:
          YANDEX_CLIENT_ID: unset-ci-verify
        run: ./gradlew test lint assembleRelease

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest
      - name: Upload emulator test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-test-results-${{ github.run_attempt }}
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn

  signed-release:
    if: github.event_name == 'workflow_dispatch'
    needs: [verify, emulator]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Validate protected signing inputs
        env:
          POCKET_EDITOR_RELEASE_KEYSTORE_BASE64: ${{ secrets.POCKET_EDITOR_RELEASE_KEYSTORE_BASE64 }}
          POCKET_EDITOR_RELEASE_STORE_FILE: ${{ runner.temp }}/pocket-editor-release.jks
          POCKET_EDITOR_RELEASE_STORE_PASSWORD: ${{ secrets.POCKET_EDITOR_RELEASE_STORE_PASSWORD }}
          POCKET_EDITOR_RELEASE_KEY_ALIAS: ${{ secrets.POCKET_EDITOR_RELEASE_KEY_ALIAS }}
          POCKET_EDITOR_RELEASE_KEY_PASSWORD: ${{ secrets.POCKET_EDITOR_RELEASE_KEY_PASSWORD }}
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
        run: |
          test -n "$POCKET_EDITOR_RELEASE_KEYSTORE_BASE64"
          test -n "$POCKET_EDITOR_RELEASE_STORE_PASSWORD"
          test -n "$POCKET_EDITOR_RELEASE_KEY_ALIAS"
          test -n "$POCKET_EDITOR_RELEASE_KEY_PASSWORD"
          test -n "$YANDEX_CLIENT_ID"
          printf '%s' "$POCKET_EDITOR_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$POCKET_EDITOR_RELEASE_STORE_FILE"
      - name: Build signed release
        env:
          POCKET_EDITOR_RELEASE_STORE_FILE: ${{ runner.temp }}/pocket-editor-release.jks
          POCKET_EDITOR_RELEASE_STORE_PASSWORD: ${{ secrets.POCKET_EDITOR_RELEASE_STORE_PASSWORD }}
          POCKET_EDITOR_RELEASE_KEY_ALIAS: ${{ secrets.POCKET_EDITOR_RELEASE_KEY_ALIAS }}
          POCKET_EDITOR_RELEASE_KEY_PASSWORD: ${{ secrets.POCKET_EDITOR_RELEASE_KEY_PASSWORD }}
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
        run: ./gradlew --no-daemon clean test lint assembleRelease
      - name: Remove decoded keystore
        if: always()
        run: |
          key_store="${{ runner.temp }}/pocket-editor-release.jks"
          if test -e "$key_store"; then
            shred -u "$key_store"
          fi
      - name: Verify signature and checksum
        run: |
          mapfile -t apksigners < <(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -print | sort -V)
          if (( ${#apksigners[@]} == 0 )); then
            echo "::error::No Android SDK apksigner executable is installed"
            exit 1
          fi
          apksigner="${apksigners[-1]}"
          test -x "$apksigner" || { echo "::error::Resolved apksigner is not executable"; exit 1; }
          "$apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > app-release.apk.sha256
          sha256sum --check app-release.apk.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pocket-editor-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
